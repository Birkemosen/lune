# Generated by esphome@aurora-smart-home v1.1.0
# https://github.com/tonylofgren/aurora-smart-home
# Rev 3.1 Lean prototype profile. Motor auto-calibration is deliberately
# disabled until current/BEMF thresholds have been characterized on hardware.

substitutions:
  device_name: lune-v6-rev31
  friendly_name: "Lune V6 Rev 3.1 Prototype"
  motor_hardware_backend: rev31_gpio
  pin_i2c_sda: GPIO8
  pin_i2c_scl: GPIO9
  pin_onewire: GPIO42
  pin_nsleep: "13"
  pin_nfault: "17"
  pin_adc_current: "4"
  pin_adc_bemf: "5"
  pin_motor_addr0: "10"
  pin_motor_addr1: "11"
  pin_motor_addr2: "12"
  pin_motor_direction: "14"
  pin_latch_arm: "16"
  pin_status_led: GPIO48
  bemf_threshold_raw: "40"
  motor_auto_start_calibration: "false"

packages:
  base:     !include ../lune.yaml
  ble:      !include ../packages/hardware/ble.yaml
  led:      !include ../packages/hardware/led.yaml
  motors31: !include ../packages/hardware/motors-rev31.yaml

# The production-intent module is ESP32-S3-WROOM-1-N8R8, not the 4 MB module
# used by the current development board profile.
esphome:
  platformio_options:
    board_build.psram_type: opi

esp32:
  flash_size: 8MB
  framework:
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_8MB: "y"

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false
