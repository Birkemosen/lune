# =============================================================================
# Lune V6 Rev 3.2 prototype profile
# =============================================================================
# Build:  make config CONFIG=configurations/lune-v6-rev32.yaml BUILD_NAME=lune-v6-rev32
#         make build  CONFIG=configurations/lune-v6-rev32.yaml BUILD_NAME=lune-v6-rev32
#
# Every pin below is the `gpio` map in
# hardware/lune-v6-rev3.2/design-contract.json, which `check_design.py` asserts
# against the schematic.  If they disagree, the contract is right.
#
# This profile must NOT be flashed onto Rev 3.1 hardware and
# `lune-v6-rev31.yaml` must NOT be flashed onto Rev 3.2: ADC_CURRENT moved from
# GPIO4 to GPIO2, GPIO4 is now STATUS_LED_N, GPIO5 lost the BEMF mux, GPIO17
# became LATCH_ARM, and LATCH_STATE on GPIO16 is active *high*.
#
# Automatic motion is disabled on purpose.  The current calibration, the tacho
# band-pass and its pulse-rejection limits are bring-up values derived from
# measured actuator data, not production constants.  Enable motion only on an
# instrumented board, after validating the current offset and gain.
# =============================================================================

substitutions:
  device_name: lune-v6-rev32
  friendly_name: "Lune V6 Rev 3.2 Prototype"
  motor_hardware_backend: rev32_gpio

  # I2C — 4k7 pull-ups fitted (R16/R17)
  pin_i2c_sda: GPIO21
  pin_i2c_scl: GPIO47
  # Protected external bus; a declared ADC1 exception
  pin_onewire: GPIO8

  # MOTOR_ENABLE.  Named nsleep for the shared base; it is a per-move decoder
  # gate, not a global nSLEEP.
  pin_nsleep: "18"
  # LATCH_STATE (/Q of the 74LVC1G74).  High means faulted OR not armed.
  pin_nfault: "16"
  pin_latch_arm: "17"

  # ADC_CURRENT, 10 V/A through the INA180A1, read at 6 dB attenuation
  pin_adc_current: "2"
  # TACHO_AMP — the qualification instrument for the digital count only
  pin_adc_tacho: "1"
  # COMM_TACHO_N, open-collector, counted by PCNT
  pin_comm_tacho: "38"

  # Four plain address bits.  No bit encodes direction; the channel/direction
  # pair maps through the decoder's 12-entry table in rev32_logic.h.
  pin_motor_addr0: "12"
  pin_motor_addr1: "11"
  pin_motor_addr2: "14"
  pin_motor_addr3: "13"

  # D3, a plain KT-0805G green LED through R23 (1k), active low
  pin_status_led: GPIO4

  motor_auto_start_calibration: "false"

packages:
  base: !include ../lune.yaml
  ble:  !include ../packages/hardware/ble.yaml
  led:  !include ../packages/hardware/led-mono.yaml

# The production-intent module is ESP32-S3-WROOM-1-N8R8: 8 MB flash, octal
# PSRAM.  A PlatformIO board description that says "No PSRAM" is generic board
# metadata and is not the effective sdkconfig.
esphome:
  platformio_options:
    board_build.psram_type: opi

esp32:
  flash_size: 8MB
  framework:
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_8MB: "y"

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false
