# =============================================================================
# Lune V6 firmware — public release build
# =============================================================================
# Identical to lune-v6.yaml (same device name, same board, same components)
# except for secrets: it leaves out packages/network/build-secrets.yaml, so the
# published factory/OTA images carry none of the build host's WiFi seed, API
# encryption key or OTA password. Home Assistant sets the API key when it adds
# the device; credentials a user provisioned stay on the device across an OTA.
#
# packages/network/wifi-release.yaml supplies the AP + captive portal.
#
# Build:  make -C lune-v6 release-firmware VERSION=v1.2.3
# =============================================================================

substitutions:
  device_name: lune-v6
  friendly_name: "Lune V6"

packages:
  base:         !include ../lune.yaml
  ble:          !include ../packages/hardware/ble.yaml
  wifi_release: !include ../packages/network/wifi-release.yaml
