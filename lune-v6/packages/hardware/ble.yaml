# BLE passive scanning for BTHome temperature sensors (Shelly BLU H&T, etc.)
# Sensors feed into the zone controller's external temperature slot via the
# lv6_bthome_bridge component (NimBLE observer callbacks).
# Configure MAC address per zone in Settings > Zone X BLE MAC.
#
# To use: set zone temp source to "BLE Sensor" and enter the device MAC address.
# The MAC is printed on the device label (e.g. "AA:BB:CC:DD:EE:FF").
#
# Keep the BLE controller off until WiFi has associated. Sharing the 2.4 GHz
# radio during the 4-way handshake is a common Auth Expired / Association
# Expired failure on ESP32-S3 + UniFi.
#
# Stack: ESP-IDF NimBLE via nimble_hub (Observer + Broadcaster, no GATT/Bluedroid).

nimble_hub:
  id: hv6_ble
  enable_on_boot: false
  # Conservative 50% duty keeps WiFi coexistence calm while still catching BTHome.
  interval: 320ms
  window: 160ms
  active: false

lv6_bthome_bridge:
  id: hv6_bthome
  hub_id: hv6_ble
  zone_controller_id: hv6_zones
  zone_temp_sensors:
    - ble_temp_zone_1
    - ble_temp_zone_2
    - ble_temp_zone_3
    - ble_temp_zone_4
    - ble_temp_zone_5
    - ble_temp_zone_6

lv6_ble_time_beacon:
  id: hv6_ble_clock
  time_id: sntp_time
  config_store_id: hv6_config
  hub_id: hv6_ble

lv6_dashboard:
  ble_time_beacon_id: hv6_ble_clock

script:
  - id: hv6_ble_start_after_wifi
    mode: restart
    then:
      # Give DHCP/API/WiFi a quiet period before sharing the 2.4 GHz radio.
      - delay: 15s
      - if:
          condition:
            wifi.connected:
          then:
            - logger.log: "BLE stack starting after stable WiFi"
            - nimble_hub.enable:
                id: hv6_ble
            - delay: 1s
            - logger.log: "BLE scan starting after stable WiFi"
            - nimble_hub.start_scan:
                id: hv6_ble
                continuous: true

wifi:
  on_connect:
    - script.execute: hv6_ble_start_after_wifi
  on_disconnect:
    # Cancel a pending delayed start as well as stopping an active scan.
    # Drop the BLE controller so a later reconnect gets the 2.4 GHz radio alone.
    - script.stop: hv6_ble_start_after_wifi
    - nimble_hub.stop_scan:
        id: hv6_ble
    - nimble_hub.disable:
        id: hv6_ble

sensor:
  - platform: template
    name: "Zone 1 BLE Temperature"
    id: ble_temp_zone_1
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    entity_category: diagnostic
    icon: "mdi:bluetooth-transfer"

  - platform: template
    name: "Zone 2 BLE Temperature"
    id: ble_temp_zone_2
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    entity_category: diagnostic
    icon: "mdi:bluetooth-transfer"

  - platform: template
    name: "Zone 3 BLE Temperature"
    id: ble_temp_zone_3
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    entity_category: diagnostic
    icon: "mdi:bluetooth-transfer"

  - platform: template
    name: "Zone 4 BLE Temperature"
    id: ble_temp_zone_4
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    entity_category: diagnostic
    icon: "mdi:bluetooth-transfer"

  - platform: template
    name: "Zone 5 BLE Temperature"
    id: ble_temp_zone_5
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    entity_category: diagnostic
    icon: "mdi:bluetooth-transfer"

  - platform: template
    name: "Zone 6 BLE Temperature"
    id: ble_temp_zone_6
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    entity_category: diagnostic
    icon: "mdi:bluetooth-transfer"
