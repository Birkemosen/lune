# After NVS config and climate setup: push durable setpoints into the HA façade
# so a flash that wiped ESPHome climate preferences does not leave the UI at 21.
# Keep climate_setpoint_sync_ready false through this sync so the resulting
# temperature_change triggers do not write back into NVS.
esphome:
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            id(climate_setpoint_sync_ready) = false;
            const auto cfg = id(hv6_config).get_config();
            {
              auto call = id(climate_zone_1).make_call();
              call.set_target_temperature(cfg.zones[0].setpoint_c);
              call.set_target_temperature_low(cfg.zones[0].setpoint_c);
              call.perform();
            }
            {
              auto call = id(climate_zone_2).make_call();
              call.set_target_temperature(cfg.zones[1].setpoint_c);
              call.set_target_temperature_low(cfg.zones[1].setpoint_c);
              call.perform();
            }
            {
              auto call = id(climate_zone_3).make_call();
              call.set_target_temperature(cfg.zones[2].setpoint_c);
              call.set_target_temperature_low(cfg.zones[2].setpoint_c);
              call.perform();
            }
            {
              auto call = id(climate_zone_4).make_call();
              call.set_target_temperature(cfg.zones[3].setpoint_c);
              call.set_target_temperature_low(cfg.zones[3].setpoint_c);
              call.perform();
            }
            {
              auto call = id(climate_zone_5).make_call();
              call.set_target_temperature(cfg.zones[4].setpoint_c);
              call.set_target_temperature_low(cfg.zones[4].setpoint_c);
              call.perform();
            }
            {
              auto call = id(climate_zone_6).make_call();
              call.set_target_temperature(cfg.zones[5].setpoint_c);
              call.set_target_temperature_low(cfg.zones[5].setpoint_c);
              call.perform();
            }
            id(climate_setpoint_sync_ready) = true;
