# Zone thermostat climate entities (one per zone).
#
# Valve control is owned by lv6_zone_controller. These climate entities are a
# Home Assistant / API façade only.
#
# Persistence rules:
# - Durable setpoints live in hv6 NVS (ZoneConfig), not in ESPHome climate prefs.
# - heat_action / idle_action must stay no-ops. They run on every boot with the
#   thermostat's own target (Home preset 21 °C after a flash wipes prefs) and
#   previously overwrote NVS via set_zone_setpoint.
# - target_temperature_change_action is also gated: ESPHome fires it from
#   refresh() during climate setup when applying the default preset, which
#   would otherwise write 21 °C into NVS before we can sync from config store.
#
# Setpoint sync once boot is ready:
#   HA / climate UI → target_temperature_change_action → zone controller → NVS
#   NVS → on_boot below → climate.control (display only; writes still gated)

globals:
  - id: climate_setpoint_sync_ready
    type: bool
    restore_value: false
    initial_value: "false"

climate:
  - platform: thermostat
    name: "Zone 1"
    id: climate_zone_1
    sensor: temp_zone_1
    min_heating_off_time: 0s
    min_heating_run_time: 0s
    min_idle_time: 0s
    default_preset: Home
    preset:
      - name: Home
        default_target_temperature_low: 21.0
      - name: Away
        default_target_temperature_low: 18.0
      - name: Sleep
        default_target_temperature_low: 19.0
    heat_action:
      - lambda: |-
          // no-op: zone controller owns valve demand
    idle_action:
      - lambda: |-
          // no-op: zone controller owns valve demand
    target_temperature_change_action:
      - lambda: |-
          if (!id(climate_setpoint_sync_ready))
            return;
          float sp = id(climate_zone_1).target_temperature;
          if (std::isnan(sp))
            sp = id(climate_zone_1).target_temperature_low;
          if (!std::isnan(sp))
            id(hv6_zones).set_zone_setpoint(0, sp);
    visual:
      min_temperature: 15
      max_temperature: 30
      temperature_step: 0.5

  - platform: thermostat
    name: "Zone 2"
    id: climate_zone_2
