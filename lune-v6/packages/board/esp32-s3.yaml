# =============================================================================
# ESP32-S3-WROOM-1-N8R8 — module used on Lune V6
# =============================================================================
# 8 MB quad flash, 8 MB octal PSRAM. ESPHome generates the OTA partition
# table from `flash_size: 8MB` (two ~3.75 MB app slots + NVS to 0x800000).
# A PlatformIO board line that says "No PSRAM" is generic metadata; octal
# mode below is the effective sdkconfig.
# =============================================================================

esphome:
  min_version: 2026.8.2
  platformio_options:
    board_build.flash_mode: qio
    board_build.psram_type: opi
    board_build.extra_flags:
      - -DBOARD_HAS_PSRAM

esp32:
  board: esp32-s3-devkitc1-n8r8
  flash_size: 8MB
  # Keep the repository's established PlatformIO build/deploy path while
  # letting ESPHome select the platform and compiler that match ESP-IDF.
  toolchain: platformio
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_8MB: "y"
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      # Prefer size over speed so dual-OTA app slots stay comfortably under 8 MB.
      COMPILER_OPTIMIZATION_SIZE: "y"
      CONFIG_SPIRAM: "y"
      CONFIG_SPIRAM_MODE_OCT: "y"
      # Prefer PSRAM for large networking/crypto/BLE allocations to keep
      # internal heap available for the dashboard and native API tasks.
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      # malloc()/new may use PSRAM (ESPHome's psram component picks caps-only
      # allocation, where all of it lands in ~37 KB of internal RAM). On 25 Oct .13
      # aborted when the native API's send buffer could not grow (operator new
      # failed) while PSRAM had 7.9 MB free. Allocations below 4 KB still prefer
      # internal RAM and fall back to PSRAM; larger ones go to PSRAM; 32 KB of
      # internal RAM stays reserved for DMA / internal-only allocations (WiFi, BT).
      # Safe here: no ISR is registered IRAM-safe (ESP_INTR_FLAG_IRAM), so none
      # runs while the cache is off during flash writes; DMA buffers are
      # allocated with MALLOC_CAP_DMA explicitly.
      CONFIG_SPIRAM_USE_CAPS_ALLOC: "n"
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "4096"
      CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL: "32768"
      # --- Optional heap attribution (DEBUG BUILDS ONLY — do not ship) ---
      # Prefer dump_task_stats (multi_heap_info / heap_caps_print_heap_info) first.
      # For call-site attribution, include packages/debug/heap-tracing.yaml from
      # lune.yaml (TEMPORARY — remove after investigation). That package sets
      # CONFIG_HEAP_TRACING_STANDALONE + STACK_DEPTH and starts tracing on boot;
      # Dump task stats then logs INTERNAL top sites via the ESPHome logger.
      # BLE host is ESP-IDF NimBLE (nimble_hub). Do not enable Bluedroid here.
      # Role/PSRAM/mem options are set from nimble_hub codegen
      # (OBSERVER+BROADCASTER, MEM_ALLOC_MODE_EXTERNAL, no GATT).
      # mDNS is disabled; Helios HTTP uses a 3s socket timeout so 15s is
      # sufficient headroom for DNS + connect + transfer on weak WiFi.
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "15"
      CONFIG_LWIP_MAX_LISTENING_TCP: "5"
      # Widen the BSD socket pool. The default of 10 is too tight: the dashboard
      # httpd can hold up to 7 connections and lwIP reserves 3, which leaves zero
      # for the native API and any optional outbound client — accept() then
      # floods with ENFILE (errno 23) and forecast fetches fail.
      # 16 (the Kconfig max) covers httpd(7) + control(3) + API(1)
      # + client(2) + headroom. Costs ~2-3 KB internal RAM, freed by dropping the
      # stock web_server.
      CONFIG_LWIP_MAX_SOCKETS: "16"
      CONFIG_HTTPD_MAX_URI_LEN: "128"
      # loopTask (ESPHome main loop) runs every component loop(), setup(), the BLE
      # advertise path and OTA. It peaked at ~11.9 KB while setup and loop paths
      # copied DeviceConfig (2.6 KB each); with Lv6ConfigStore::read() the peak is
      # ~5.4 KB (21 Oct, both boards, incl. a full motor calibration). 12 KB keeps
      # more than 2x headroom for unmeasured paths (OTA) and returns 4 KB.
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "12288"
      # FreeRTOS runtime stats — lets the dashboard report per-core CPU load and
      # per-task CPU% / stack headroom (uxTaskGetSystemState) so a task that
      # saturates a core or starves the loop can be pinpointed. The stats-
      # formatting helper functions are deliberately NOT enabled (we compute the
      # percentages ourselves) to keep the flash cost to a few KB.
      CONFIG_FREERTOS_USE_TRACE_FACILITY: "y"
      CONFIG_FREERTOS_GENERATE_RUN_TIME_STATS: "y"
    # ESPHome's advanced option is the authoritative loopTask stack setting;
    # its default would override CONFIG_ESP_MAIN_TASK_STACK_SIZE above.
    advanced:
      loop_task_stack_size: 12288

# Octal PSRAM on the N8R8. ignore_not_found must stay false: a missing PSRAM
# is a hardware fault, not a config option.
psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false
