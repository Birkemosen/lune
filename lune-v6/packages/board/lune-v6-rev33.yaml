# =============================================================================
# Lune V6 PCB — hardware revision 3.3
# =============================================================================
# Pin map is the `gpio` map in hardware/lune-v6-rev3.3/design-contract.json,
# which `check_design.py` asserts against the schematic. If they disagree, the
# contract is right.
#
# Safety path:
#
#   * There is no hardware fault latch. The hazard decision behind that is
#     recorded in design-review R3.3-3.
#   * FAULT_N_RAW reaches firmware directly on GPIO16, active LOW, pulled up by
#     R3. Reading it as active high is wrong in the dangerous direction.
#   * The rail overcurrent comparator has its own net on GPIO48, pulled up by
#     R41, so a bridge fault and a rail overcurrent are distinguishable (O12).
#   * DRIVER_N_SLEEP is driven from GPIO17. R31 pulls it down, so GPIOs in
#     high-Z put the drivers to sleep and U7's NAND inhibits the decoder.
#   * ADC_TACHO is in the continuous stream at 6 dB, matching ADC_CURRENT.
#     R11/R12 moved from 1k/1k to 10k/4k7 so TACHO_REF sits at 1.055 V and the
#     amplified ripple fits the 1.75 V span. Two attenuations on one ADC unit is
#     what ESP-IDF rejects and what took the whole stream down as design-review
#     B8; they must stay equal.
#   * R6 10k -> 12k sets the rail overcurrent trip to 150 mA (ECO rev3.3-P).
#
# Automatic motion stays disabled. The current calibration and the tacho
# qualification band are still bring-up values from measured actuator data, not
# production constants.
# =============================================================================

substitutions:
  motor_hardware_backend: rev33_gpio

  # I2C — 4k7 pull-ups fitted (R37/R38)
  pin_i2c_sda: GPIO21
  pin_i2c_scl: GPIO47
  # Protected external bus; a declared ADC1 exception
  pin_onewire: GPIO8

  # MOTOR_ENABLE. Named nsleep for the shared base; it is a per-move decoder
  # gate, not a global nSLEEP. The real nSLEEP is pin_driver_nsleep below.
  pin_nsleep: "18"
  # FAULT_N_RAW, now only the three DRV8411 nFAULT outputs wired-AND, pulled up
  # by R3 and filtered by C3. ACTIVE LOW.
  pin_nfault: "16"
  # FAULT_USB_RAW, the TPS2553 fault pin on its own net (R42 pull-up, C42).
  # Split off the wired-AND so a USB current-limit event is distinguishable from
  # a bridge fault. ACTIVE LOW. Mostly unreadable today: a completed latch-off
  # removes power from the ESP32 too (O6), so it only reports during the
  # current-limiting window before latch-off — or always, if O6 is ever resolved
  # by keeping the logic rail alive upstream.
  pin_fault_usb: "15"
  # RAIL_OVERCURRENT, U3 pin 1 on its own net (R41 pull-up, C43). ACTIVE LOW.
  # Routed parallel to COMM_TACHO_N from U3 down the east edge, both pulled up
  # at the module end. Trip is 150 mA nominal (142-158 worst case); see design-review
  # R3.3-4 for why that sits below the DRV8411's own 180-230 mA regulation.
  pin_rail_overcurrent: "48"
  # DRIVER_N_SLEEP, the firmware-held drive permit. High wakes the
  # three bridges and releases U7's decoder inhibit; R31 defines the safe state.
  pin_driver_nsleep: "17"

  # ADC_CURRENT, 10 V/A through the INA180A1, read at 6 dB attenuation
  pin_adc_current: "2"
  # TACHO_AMP through R13 (1k). Sampled at 6 dB, the SAME attenuation as
  # ADC_CURRENT — see the note above.
  pin_adc_tacho: "1"
  adc_tacho_enabled: "true"
  # COMM_TACHO_N, open-collector, counted by PCNT
  pin_comm_tacho: "38"

  # Four plain address bits. No bit encodes direction; the channel/direction
  # pair maps through the decoder's 12-entry table in rev33_logic.h.
  pin_motor_addr0: "12"
  pin_motor_addr1: "11"
  pin_motor_addr2: "14"
  pin_motor_addr3: "13"

  # D3, a plain KT-0805G green LED through R23 (1k), active low
  pin_status_led: GPIO4

  motor_auto_start_calibration: "false"

packages:
  led: !include ../hardware/led-mono.yaml
