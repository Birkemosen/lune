# Generated by esphome@aurora-smart-home v1.1.0
# https://github.com/tonylofgren/aurora-smart-home
#
# Lune Touch shared base configuration. The active prototype entrypoint is
# configurations/lune-touch-7.yaml.

substitutions:
  device_name: lune-touch
  friendly_name: "Lune Touch"
  fallback_ap_ssid: "Lune Touch Setup"

esphome:
  name: ${device_name}
  name_add_mac_suffix: true
  friendly_name: ${friendly_name}
  comment: "Lune Touch 7-inch house coordinator"
  project:
    name: guldborg-birkemose.lune-touch
    version: ${firmware_version}
  on_boot:
    - priority: 800
      then:
        - logger.log: "Lune Touch booting: config/NVS and coordinator model first"
    - priority: 600
      then:
        - logger.log: "Lune Touch display/LVGL bringup point"
    - priority: 250
      then:
        - logger.log: "Lune Touch WiFi and coordinator polling may start after display shell"

packages:
  version: !include version.yaml
  board: !include packages/board/esp32-s3-16mb-psram.yaml
  wifi: !include packages/network/wifi.yaml
  api: !include packages/network/api.yaml
  ota: !include packages/network/ota.yaml
  diagnostics: !include packages/system/diagnostics.yaml
  display_contract: !include packages/display/lvgl_stability.yaml

external_components:
  - source:
      type: local
      path: ../components
    components:
      - ch422g
      - lune_touch_coordinator
      - rpi_dpi_rgb

logger:
  level: DEBUG
  logs:
    component: WARN
    sensor: WARN
    text_sensor: WARN

preferences:
  flash_write_interval: 15min

improv_serial:

mdns:
  disabled: true

time:
  - platform: sntp
    id: sntp_time

lune_touch_coordinator:
  id: lune_touch_app
  node_stale_after: 300s
