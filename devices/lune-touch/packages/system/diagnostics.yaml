# Generated by esphome@aurora-smart-home v1.1.0
# https://github.com/tonylofgren/aurora-smart-home

debug:
  update_interval: 30s

sensor:
  - platform: wifi_signal
    id: wifi_signal_dbm
    name: "Lune Touch WiFi Signal"
    update_interval: 60s
  - platform: uptime
    id: lune_touch_uptime
    name: "Lune Touch Uptime"
    update_interval: 60s
  - platform: debug
    free:
      name: "Lune Touch Heap Free"
    block:
      name: "Lune Touch Heap Max Block"
    loop_time:
      name: "Lune Touch Loop Time"

text_sensor:
  - platform: version
    id: firmware_version_text
    name: "Lune Touch Firmware Version"
  - platform: wifi_info
    ip_address:
      id: ip_address_text
      name: "Lune Touch IP Address"
    ssid:
      id: connected_ssid_text
      name: "Lune Touch Connected SSID"
    mac_address:
      id: mac_address_text
      name: "Lune Touch MAC Address"
