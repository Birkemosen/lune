obj:
  id: dashboard_manifold_${node}_card
  x: 20
  y: ${y}
  width: 984
  height: 108
  bg_color: 0x171519
  bg_opa: 100%
  border_color: 0x403945
  border_width: 1
  radius: 16
  pad_all: 0
  scrollable: false
  widgets:
    - label:
        id: dashboard_manifold_${node}_label
        x: 16
        y: 12
        width: 120
        height: 88
        text: "Not connected"
        text_color: 0xF7F4F2
        text_font: montserrat_16
        long_mode: clip
        bg_color: 0x171519
        bg_opa: 100%
    - !include
        file: manifold_zone_cell.yaml
        vars: {node: "${node}", zone: 0, zone_human: 1, x: 148}
    - !include
        file: manifold_zone_cell.yaml
        vars: {node: "${node}", zone: 1, zone_human: 2, x: 286}
    - !include
        file: manifold_zone_cell.yaml
        vars: {node: "${node}", zone: 2, zone_human: 3, x: 424}
    - !include
        file: manifold_zone_cell.yaml
        vars: {node: "${node}", zone: 3, zone_human: 4, x: 562}
    - !include
        file: manifold_zone_cell.yaml
        vars: {node: "${node}", zone: 4, zone_human: 5, x: 700}
    - !include
        file: manifold_zone_cell.yaml
        vars: {node: "${node}", zone: 5, zone_human: 6, x: 838}
