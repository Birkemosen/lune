button:
  id: dashboard_m${node}_z${zone}_button
  x: ${x}
  y: 0
  width: 134
  height: 108
  bg_color: 0x2C2C2E
  bg_opa: 100%
  border_color: 0x38383A
  border_width: 1
  radius: 14
  pad_all: 0
  widgets:
    - obj:
        id: dashboard_m${node}_z${zone}_stripe
        x: 110
        y: 12
        width: 10
        height: 10
        bg_color: 0x8E8E93
        bg_opa: 100%
        border_width: 0
        radius: 5
        scrollable: false
    - label:
        id: dashboard_m${node}_z${zone}_name_label
        x: 14
        y: 12
        width: 94
        height: 20
        text: "Zone ${zone_human}"
        text_color: 0xFFFFFF
        text_font: montserrat_16
        long_mode: clip
        bg_color: 0x2C2C2E
        bg_opa: 100%
    - label:
        id: dashboard_m${node}_z${zone}_temperature_label
        x: 14
        y: 40
        width: 94
        height: 28
        text: "--.- C"
        text_color: 0x64D2FF
        text_font: montserrat_22
        long_mode: clip
        bg_color: 0x2C2C2E
        bg_opa: 100%
    - label:
        id: dashboard_m${node}_z${zone}_setpoint_label
        x: 14
        y: 78
        width: 94
        height: 20
        text: "\uF054 --.- C"
        text_color: 0xBF5AF2
        text_font: montserrat_16
        long_mode: clip
        bg_color: 0x2C2C2E
        bg_opa: 100%
    - bar:
        id: dashboard_m${node}_z${zone}_bar
        x: 110
        y: 20
        width: 10
        height: 78
        min_value: 0
        max_value: 5
        value: 0
        animated: false
        bg_color: 0x38383A
        radius: 5
        indicator:
          bg_color: 0xFF9F0A
          radius: 5
    - obj:
        id: dashboard_m${node}_z${zone}_tick_1
        x: 110
        y: 36
        width: 10
        height: 1
        bg_color: 0x2C2C2E
        bg_opa: 100%
        border_width: 0
    - obj:
        id: dashboard_m${node}_z${zone}_tick_2
        x: 110
        y: 52
        width: 10
        height: 1
        bg_color: 0x2C2C2E
        bg_opa: 100%
        border_width: 0
    - obj:
        id: dashboard_m${node}_z${zone}_tick_3
        x: 110
        y: 68
        width: 10
        height: 1
        bg_color: 0x2C2C2E
        bg_opa: 100%
        border_width: 0
    - obj:
        id: dashboard_m${node}_z${zone}_tick_4
        x: 110
        y: 84
        width: 10
        height: 1
        bg_color: 0x2C2C2E
        bg_opa: 100%
        border_width: 0
  on_click:
    - if:
        condition:
          lambda: return id(lune_touch_app).display_select_zone(${node}, ${zone});
        then:
          - lvgl.label.update:
              id: zone_modal_room_label
              text: !lambda |-
                return id(lune_touch_app).display_selected_room_text();
          - lvgl.label.update:
              id: zone_modal_feedback_label
              text: "Changes save automatically. V6 validates every command."
          - lvgl.widget.show: zone_control_modal
