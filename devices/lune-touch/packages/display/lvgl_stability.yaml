                std::string setpoint = second_break == std::string::npos
                    ? "--.- C" : cell.substr(second_break + 1);
                const size_t temperature_value = temperature.find_first_of("-0123456789");
                const size_t setpoint_value = setpoint.find_first_of("-0123456789");
                if (temperature_value != std::string::npos)
                  temperature.erase(0, temperature_value);
                if (setpoint_value != std::string::npos)
                  setpoint.erase(0, setpoint_value);
                set_label(zone_name_labels[node][zone], name);
                set_label(zone_temperature_labels[node][zone], temperature);
                set_label(zone_setpoint_labels[node][zone], std::string("\xEF\x81\x94 ") + setpoint);
                if (zone_color_cache[node][zone] != color) {
                  zone_color_cache[node][zone] = color;
                  lv_obj_set_style_bg_color(zone_stripes[node][zone], lv_color_hex(color), LV_PART_MAIN);
                  lv_obj_set_style_bg_color(zone_bars[node][zone], lv_color_hex(color), LV_PART_INDICATOR);
                }
                const uint8_t valve = id(lune_touch_app).display_zone_valve_pct(node, zone);
                const int level = valve == 0 ? 0 : std::min(5, (static_cast<int>(valve) + 19) / 20);
                if (lv_bar_get_value(zone_bars[node][zone]) != level)
                  lv_bar_set_value(zone_bars[node][zone], level, LV_ANIM_OFF);
              }
            }

            const std::string heat_source = id(lune_touch_app).display_heat_source_text();
            const std::string forecast = id(lune_touch_app).display_forecast_text();
            const std::string problem = id(lune_touch_app).display_problem_text();
            const bool has_problem = id(lune_touch_app).display_problem_visible();
            set_label(id(dashboard_heat_source_status_label), heat_source);
            set_label(id(dashboard_weather_status_label), forecast);
            set_label(id(dashboard_activity_label), problem);
            if (has_problem &&
                lv_obj_has_flag(id(dashboard_problem_card), LV_OBJ_FLAG_HIDDEN))
              lv_obj_clear_flag(id(dashboard_problem_card), LV_OBJ_FLAG_HIDDEN);
            else if (!has_problem &&
                     !lv_obj_has_flag(id(dashboard_problem_card), LV_OBJ_FLAG_HIDDEN))
              lv_obj_add_flag(id(dashboard_problem_card), LV_OBJ_FLAG_HIDDEN);
            if (has_problem &&
                !lv_obj_has_flag(id(dashboard_bottom_status_bar), LV_OBJ_FLAG_HIDDEN))
              lv_obj_add_flag(id(dashboard_bottom_status_bar), LV_OBJ_FLAG_HIDDEN);
            else if (!has_problem &&
                     lv_obj_has_flag(id(dashboard_bottom_status_bar), LV_OBJ_FLAG_HIDDEN))
              lv_obj_clear_flag(id(dashboard_bottom_status_bar), LV_OBJ_FLAG_HIDDEN);
            const uint32_t heat_color = heat_source.rfind("\xEF\x80\x8C On", 0) == 0 ? 0x34D399 :
                                        heat_source.rfind("\xEF\x80\x8D Off", 0) == 0 ? 0x8E867C : 0xEF4444;
            if (heat_color_cache != heat_color) {
              heat_color_cache = heat_color;
              lv_obj_set_style_text_color(id(dashboard_heat_source_status_label), lv_color_hex(heat_color),
                                          LV_PART_MAIN);
            }
            static bool startup_complete = false;
            if (!startup_complete) {
              startup_complete = true;
              lv_obj_add_flag(id(dashboard_startup_overlay), LV_OBJ_FLAG_HIDDEN);
            }

lvgl:
  id: lune_touch_lvgl
  displays:
    - touch_lcd
  touchscreens:
    - touch_panel
  # Partial invalidation avoids transferring a complete 1024x600 RGB565 frame
  # every refresh. 12% follows ESPHome's PSRAM guidance for large displays.
  buffer_size: 12%
  full_refresh: false
  draw_rounding: 2
  byte_order: little_endian
  log_level: WARN
  update_interval: 50ms
  # LVGL 9 models display background styling on the persistent bottom layer.
  # This replaces the deprecated LVGL 8 disp_bg_* compatibility properties.
  bottom_layer:
    bg_color: 0x100F12
    bg_opa: 100%
  widgets:
    - obj:
        id: lune_touch_root
        x: 0
        y: 0
        width: 1024
        height: 600
        bg_color: 0x100F12
        bg_opa: 100%
        border_width: 0
        outline_width: 0
        radius: 0
        pad_all: 0
        scrollable: false
