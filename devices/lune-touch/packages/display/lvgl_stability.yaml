# Waveshare ESP32-S3-Touch-LCD-7B local interface. The local display is one
# glanceable appliance dashboard. Browser views own setup and diagnostics.

i2c:
  - id: waveshare_panel_i2c
    sda: GPIO8
    scl: GPIO9
    frequency: 400kHz
    scan: false
    sda_pullup_enabled: true
    scl_pullup_enabled: true

ch422g:
  - id: waveshare_panel_io
    i2c_id: waveshare_panel_i2c
    initial_output_bits: 0xDF

display:
  - platform: rpi_dpi_rgb
    id: touch_lcd
    dimensions:
      width: 1024
      height: 600
    color_order: RGB
    auto_clear_enabled: false
    update_interval: never
    # 80 MHz Octal PSRAM is bandwidth-limited while WiFi reads the embedded
    # dashboard from flash. 20 MHz keeps the RGB stream below Espressif's
    # practical ~22 MHz ceiling for this memory configuration.
    pclk_frequency: 20MHz
    pclk_inverted: true
    hsync_pulse_width: 162
    hsync_back_porch: 152
    hsync_front_porch: 48
    vsync_pulse_width: 45
    vsync_back_porch: 13
    vsync_front_porch: 3
    de_pin: GPIO5
    pclk_pin: GPIO7
    hsync_pin:
      number: GPIO46
      ignore_strapping_warning: true
    vsync_pin:
      number: GPIO3
      ignore_strapping_warning: true
    enable_pin:
      ch422g: waveshare_panel_io
      number: 2
      mode:
        output: true
    data_pins:
      - GPIO14
      - GPIO38
      - GPIO18
      - GPIO17
      - GPIO10
      - GPIO39
      - number: GPIO0
        ignore_strapping_warning: true
      - number: GPIO45
        ignore_strapping_warning: true
      - GPIO48
      - GPIO47
      - GPIO21
      - GPIO1
      - GPIO2
      - GPIO42
      - GPIO41
      - GPIO40

touchscreen:
  - platform: gt911
    id: touch_panel
    display: touch_lcd
    i2c_id: waveshare_panel_i2c
    interrupt_pin: GPIO4
    reset_pin:
      ch422g: waveshare_panel_io
      number: 1
      mode:
        output: true
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false
    update_interval: 20ms

