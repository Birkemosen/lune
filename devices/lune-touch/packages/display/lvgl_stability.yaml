# Generated by esphome@aurora-smart-home v1.1.0
# https://github.com/tonylofgren/aurora-smart-home
#
# Waveshare ESP32-S3-Touch-LCD-7B bringup profile.
#
# ESPHome's rpi_dpi_rgb driver keeps the key stable pipeline defaults used by
# the 4.3-inch reference firmware: one PSRAM framebuffer and a 10-line RGB
# bounce buffer. The board profile enables XIP-from-PSRAM so flash/NVS writes do
# not disable external-memory cache while the RGB ISR is refilling bounce buffers.

i2c:
  - id: waveshare_panel_i2c
    sda: GPIO8
    scl: GPIO9
    frequency: 400kHz
    scan: false
    sda_pullup_enabled: true
    scl_pullup_enabled: true

ch422g:
  - id: waveshare_panel_io
    i2c_id: waveshare_panel_i2c
    # Waveshare 7B demo starts with all outputs high, but EXIO5 must stay low
    # on our prototype so USB-Serial-JTAG remains selected instead of CAN.
    initial_output_bits: 0xDF

display:
  - platform: rpi_dpi_rgb
    id: touch_lcd
    dimensions:
      width: 1024
      height: 600
    color_order: RGB
    auto_clear_enabled: false
    update_interval: never
    pclk_frequency: 30MHz
    pclk_inverted: true
    hsync_pulse_width: 162
    hsync_back_porch: 152
    hsync_front_porch: 48
    vsync_pulse_width: 45
    vsync_back_porch: 13
    vsync_front_porch: 3
    de_pin: GPIO5
    pclk_pin: GPIO7
    hsync_pin:
      number: GPIO46
      ignore_strapping_warning: true
    vsync_pin:
      number: GPIO3
      ignore_strapping_warning: true
    enable_pin:
      ch422g: waveshare_panel_io
      number: 2
      mode:
        output: true
    data_pins:
      - GPIO14
      - GPIO38
      - GPIO18
      - GPIO17
      - GPIO10
      - GPIO39
      - number: GPIO0
        ignore_strapping_warning: true
      - number: GPIO45
        ignore_strapping_warning: true
      - GPIO48
      - GPIO47
      - GPIO21
      - GPIO1
      - GPIO2
      - GPIO42
      - GPIO41
      - GPIO40

touchscreen:
  - platform: gt911
    id: touch_panel
    display: touch_lcd
    i2c_id: waveshare_panel_i2c
    interrupt_pin: GPIO4
    reset_pin:
      ch422g: waveshare_panel_io
      number: 1
      mode:
        output: true
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false
    update_interval: 20ms

text_sensor:
  - platform: template
    id: touch_house_summary_text
    internal: true
    update_interval: 15s
    lambda: |-
      return id(lune_touch_app).house_summary_text();
    on_value:
      then:
        - lvgl.label.update:
            id: header_status_label
            text: !lambda |-
              return x.c_str();
  - platform: template
    id: touch_forecast_summary_text
    internal: true
    update_interval: 15s
    lambda: |-
      return id(lune_touch_app).forecast_summary_text();
    on_value:
      then:
        - lvgl.label.update:
            id: touch_weather_cache_label
            text: !lambda |-
              return x.c_str();
  - platform: template
    id: touch_command_summary_text
    internal: true
    update_interval: 15s
    lambda: |-
      return id(lune_touch_app).command_summary_text();
    on_value:
      then:
        - lvgl.label.update:
            id: house_event_label
            text: !lambda |-
              return x.c_str();

lvgl:
  id: lune_touch_lvgl
  displays:
    - touch_lcd
  touchscreens:
    - touch_panel
  buffer_size: 3%
  full_refresh: false
  draw_rounding: 2
  byte_order: little_endian
  log_level: WARN
  update_interval: 16ms
  disp_bg_color: 0x11151A
  disp_bg_opa: 100%
