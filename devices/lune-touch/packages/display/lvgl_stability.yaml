                const size_t second_break = first_break == std::string::npos
                    ? std::string::npos : cell.find('\n', first_break + 1);
                const std::string room_name = first_break == std::string::npos
                    ? cell : cell.substr(0, first_break);
                const std::string name = "Z" + std::to_string(zone + 1) + "  " + room_name;
                std::string temperature = first_break == std::string::npos
                    ? "--.- C" : cell.substr(first_break + 1,
                        second_break == std::string::npos ? std::string::npos
