              visible_manifolds++;
              zone_masks[node] = id(lune_touch_app).display_zone_mask(node);
            }

            const uint64_t layout_signature = static_cast<uint64_t>(visible_manifolds) |
                (static_cast<uint64_t>(current_page) << 4) |
                (static_cast<uint64_t>(page_count) << 8) |
                (static_cast<uint64_t>(zone_masks[0]) << 12) |
                (static_cast<uint64_t>(zone_masks[1]) << 18) |
                (static_cast<uint64_t>(zone_masks[2]) << 24) |
                (static_cast<uint64_t>(zone_masks[3]) << 30);
            static uint64_t previous_layout_signature = UINT64_MAX;
            if (layout_signature != previous_layout_signature) {
              previous_layout_signature = layout_signature;
              constexpr int content_top = 88;
              constexpr int content_height = 438;
              constexpr int manifold_gap = 12;
              constexpr int zone_grid_x = 156;
              constexpr int zone_grid_width = 808;
