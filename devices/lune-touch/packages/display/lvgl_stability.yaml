              {{id(dashboard_m3_z0_tick_1), id(dashboard_m3_z0_tick_2), id(dashboard_m3_z0_tick_3), id(dashboard_m3_z0_tick_4)}, {id(dashboard_m3_z1_tick_1), id(dashboard_m3_z1_tick_2), id(dashboard_m3_z1_tick_3), id(dashboard_m3_z1_tick_4)}, {id(dashboard_m3_z2_tick_1), id(dashboard_m3_z2_tick_2), id(dashboard_m3_z2_tick_3), id(dashboard_m3_z2_tick_4)}, {id(dashboard_m3_z3_tick_1), id(dashboard_m3_z3_tick_2), id(dashboard_m3_z3_tick_3), id(dashboard_m3_z3_tick_4)}, {id(dashboard_m3_z4_tick_1), id(dashboard_m3_z4_tick_2), id(dashboard_m3_z4_tick_3), id(dashboard_m3_z4_tick_4)}, {id(dashboard_m3_z5_tick_1), id(dashboard_m3_z5_tick_2), id(dashboard_m3_z5_tick_3), id(dashboard_m3_z5_tick_4)}}
