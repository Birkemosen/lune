esphome:
  platformio_options:
    platform: platformio/espressif32@6.12.0
    platform_packages:
      - platformio/toolchain-xtensa-esp-elf@14.2.0+20251107
    board_build.flash_mode: qio
    board_build.psram_type: qio
    board_build.extra_flags:
      - -DBOARD_HAS_PSRAM

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 4MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_SPIRAM: "y"
      # Prefer PSRAM for large networking/crypto/BLE allocations to keep
      # internal heap available for the dashboard and native API tasks.
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      # mDNS is disabled; Helios HTTP uses a 3s socket timeout so 15s is
      # sufficient headroom for DNS + connect + transfer on weak WiFi.
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "15"
      CONFIG_LWIP_MAX_LISTENING_TCP: "5"
      # Widen the BSD socket pool. The default of 10 is too tight: the dashboard
      # httpd can hold up to 7 connections and lwIP reserves 3, which leaves zero
      # for the native API and any optional outbound client — accept() then
      # floods with ENFILE (errno 23) and forecast fetches fail
      # fetches fail. 16 (the Kconfig max) covers httpd(7) + control(3) + API(1)
      # + client(2) + headroom. Costs ~2-3 KB internal RAM, freed by dropping the
      # stock web_server.
      CONFIG_LWIP_MAX_SOCKETS: "16"
      CONFIG_HTTPD_MAX_URI_LEN: "128"
    # loopTask (ESPHome main loop) runs every component loop() plus the BLE
      # advertise lambda. The dashboard/bridge setup path also copies the
      # ~1.9 KB DeviceConfig, and the 8 KB stack overflows before setup()
      # completes. Keep 16 KB headroom for those snapshots and BLE bursts.
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "16384"
      # FreeRTOS runtime stats — lets the dashboard report per-core CPU load and
      # per-task CPU% / stack headroom (uxTaskGetSystemState) so a task that
      # saturates a core or starves the loop can be pinpointed. The stats-
      # formatting helper functions are deliberately NOT enabled (we compute the
      # percentages ourselves) to keep the flash cost to a few KB.
      CONFIG_FREERTOS_USE_TRACE_FACILITY: "y"
      CONFIG_FREERTOS_GENERATE_RUN_TIME_STATS: "y"
    # ESPHome's advanced option is the authoritative loopTask stack setting;
    # its default would override CONFIG_ESP_MAIN_TASK_STACK_SIZE above.
    advanced:
      loop_task_stack_size: 16384

# Enable the ESPHome `psram:` component so the debug platform can expose a
# Free PSRAM sensor. The IDF sdkconfig above already enables SPIRAM at the
# kernel level; this block is purely for ESPHome runtime visibility.
psram:
  mode: quad
  speed: 80MHz
